
version: "3.9"
services:
  postgres:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_DB: eios_cloud
      POSTGRES_USER: eios
      POSTGRES_PASSWORD: eios_secure_password
    ports:
      - "5432:5432"
    volumes:
      - eios_cloud_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    image: node:20
    working_dir: /app
    command: npm run start
    environment:
      DATABASE_URL: postgres://eios:eios_secure_password@postgres:5432/eios_cloud
      REDIS_URL: redis://redis:6379
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - redis

volumes:
  eios_cloud_data:
